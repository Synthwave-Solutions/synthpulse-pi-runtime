name: SynthPulse Pi WebUI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: synthpulse-pi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Synthwave-Solutions/hermes-webui
          ref: 36a5568a02539708cfbc90423e17db806f1a27c4

      - name: Build own WebUI and engine
        run: docker build -f packaging/pi/Dockerfile -t synthpulse-webui-pi:${GITHUB_SHA} .
      - name: Validate and archive
        run: |
          test "$(docker image inspect synthpulse-webui-pi:${GITHUB_SHA} --format '{{.Architecture}}')" = arm64
          docker run --rm --entrypoint sh synthpulse-webui-pi:${GITHUB_SHA} -c 'git --version && gh --version && chromium --version && command -v Xtigervnc'
          docker run --rm --network none --entrypoint /opt/synthpulse/hermes-agent/venv/bin/python synthpulse-webui-pi:${GITHUB_SHA} -c 'import mcp,httpx2;from tools.browser_tool_install import _find_agent_browser,_chromium_installed;from tools.computer_use.cua_backend_driver import cua_driver_runtime_contract_status;assert _find_agent_browser();assert _chromium_installed();s=cua_driver_runtime_contract_status();print(s);assert s["ready"]'
          mkdir -p pi-release
          docker save synthpulse-webui-pi:${GITHUB_SHA} | gzip > pi-release/synthpulse-webui-arm64.tar.gz
          python3 - <<'BUILD'
          import json,os,pathlib,hashlib
          p=pathlib.Path('pi-release');f=p/'synthpulse-webui-arm64.tar.gz';h=hashlib.file_digest(f.open('rb'),'sha256').hexdigest()
          data={'repository':os.environ['GITHUB_REPOSITORY'],'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'architecture':'arm64','hardware_tested':False,'engine_commit':'9412abd379ea92418557ffd6beb84bd136dc290f','source_repository':'Synthwave-Solutions/hermes-webui','source_commit':'36a5568a02539708cfbc90423e17db806f1a27c4','image':'synthpulse-webui-pi:'+os.environ['GITHUB_SHA'],'sha256':{f.name:h}}
          (p/'provenance.json').write_text(json.dumps(data,indent=2)+'\n')
          (p/'SHA256SUMS').write_text(h+'  '+f.name+'\n')
          BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: synthpulse-webui-pi
          path: pi-release/
      - name: Publish own prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create --repo "$GITHUB_REPOSITORY" "synthpulse-pi-${GITHUB_RUN_NUMBER}" pi-release/* --target "$GITHUB_SHA" --prerelease --title "SynthPulse WebUI - standalone Raspberry Pi" --notes "ARM64 image built from our WebUI and engine forks. No production credentials or state. Account onboarding and physical Pi test pending."
